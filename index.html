<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>マイ付箋ボード</title>
    <meta name="description" content="思いつきをすぐに貼って、自由に整理できる付箋ボード" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand" aria-label="マイ付箋ボード">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>マイ付箋ボード</h1>
            <p>思いつきを、すぐそこに。</p>
          </div>
        </div>
        <div class="search-area" role="search">
          <label class="search-box" for="noteSearch">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="noteSearch" type="search" placeholder="付箋を検索" autocomplete="off" />
          </label>
          <output class="search-count" id="searchCount" aria-live="polite">0 / 0 件</output>
        </div>
        <div class="actions">
          <span class="save-status" id="saveStatus" role="status"><span aria-hidden="true">●</span> 自動保存</span>
          <button class="arrange-button" id="arrangeNotes" type="button" title="付箋を整列"><span aria-hidden="true">▦</span><span>整列</span></button>
          <div class="add-menu-wrap">
            <button class="add-button" id="addNote" type="button" aria-haspopup="true" aria-expanded="false"><span aria-hidden="true">＋</span><span>付箋を追加</span></button>
            <div class="color-menu add-color-menu" id="addColorMenu" role="menu" aria-label="付箋の色を選択" hidden></div>
          </div>
        </div>
      </header>

      <nav class="filter-bar" aria-label="プロジェクトと付箋の表示切り替え">
        <div class="project-controls">
          <label for="projectSelect">プロジェクト</label>
          <select id="projectSelect" aria-label="プロジェクトを切り替え"></select>
          <button class="project-action project-add" id="createProject" type="button" aria-label="プロジェクトを作成" title="プロジェクトを作成">＋</button>
          <button class="project-action" id="renameProject" type="button" aria-label="プロジェクト名を変更" title="プロジェクト名を変更">✎</button>
          <button class="project-action project-delete" id="deleteProject" type="button" aria-label="プロジェクトを削除" title="プロジェクトを削除">×</button>
        </div>
        <div class="status-controls">
          <span class="filter-label">表示</span>
          <div class="filter-tabs" id="filterTabs">
            <button type="button" data-filter="incomplete" aria-pressed="true">未完了</button>
            <button type="button" data-filter="complete" aria-pressed="false">完了</button>
            <button type="button" data-filter="all" aria-pressed="false">すべて</button>
          </div>
        </div>
      </nav>

      <section class="board-wrap" aria-label="付箋ボード">
        <div class="board" id="board">
          <div class="complete-dropzone" id="completeDropzone" aria-label="ここに付箋をドラッグすると完了になります">
            <span class="drop-check" aria-hidden="true">✓</span>
            <span><strong>完了したこと</strong><small>ここへドラッグ</small></span>
          </div>
          <div class="empty-state" id="emptyState">
            <span class="empty-note" aria-hidden="true"></span>
            <h2>まだ付箋がありません</h2>
            <p>「付箋を追加」から、最初のアイデアを貼ってみましょう。</p>
            <button id="emptyAdd" type="button">最初の付箋を追加</button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p><span aria-hidden="true">✦</span> 付箋はドラッグして自由に動かせます</p>
        <p>この端末に自動保存されます</p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
